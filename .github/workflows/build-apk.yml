name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mpesa-backend/package-lock.json

      - name: Backend tests
        working-directory: mpesa-backend
        run: |
          npm ci
          npm test

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Copy APK to releases folder
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk releases/smartchama-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartchama-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
