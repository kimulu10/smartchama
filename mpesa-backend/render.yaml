services:
  - name: smartchama-mpesa
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORT_CODE
        value: "174379"
      - key: MPESA_PASS_KEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: PORT
        value: "3000"