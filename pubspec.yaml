name: smartchama
description: SmartChama Flutter App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8

  # HTTP (used by M-Pesa payment service)
  http: ^1.2.0

  # Firebase Core
  firebase_core: ^2.32.0

  # Firebase Authentication
  firebase_auth: ^4.17.0

  # Cloud Firestore
  cloud_firestore: ^4.17.0

  # Optional but useful later
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4

  # State management - Riverpod
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # UI utilities
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Date formatting
  intl: ^0.19.0
  url_launcher: ^6.3.2
  pdf: ^3.12.0
  fl_chart: ^0.66.0
  sqflite: ^2.3.0
  path: ^1.9.0

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Biometric auth
  local_auth: ^2.2.0

  # Local notifications
  flutter_local_notifications: ^17.2.2

  # Image compression
  flutter_image_compress: ^2.2.0

  # HTTP client for Stripe
  dio: ^5.4.1

  # Permission handling
  permission_handler: ^11.3.1

  # Timezone
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true 